# ============================================================================
# MySQL Datasource
# ----------------------------------------------------------------------------
# Values are pulled from environment variables with LOCAL-DEV-ONLY fallbacks.
# Never rely on the fallback values outside your own machine - set real
# environment variables (or a proper secrets manager) in any shared/deployed
# environment.
# ============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moocash?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# 'update' is convenient for local development but should NOT be used in a
# shared or production environment: it silently alters live schema on boot.
# Switch to 'validate' (or 'none') and manage schema changes with a migration
# tool such as Flyway or Liquibase once this goes beyond a single dev machine.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================================
# Security
# ----------------------------------------------------------------------------
# JWT_SECRET must be overridden via an environment variable in any environment
# that isn't your own laptop. A fallback is provided only so `mvn spring-boot:run`
# works out of the box for local development; do not deploy with this default.
# ============================================================================
jwt.secret=${JWT_SECRET:CHANGE_ME_local_dev_only_9a4f2c8d3e1f5b6a7c8d9e0f1a2b3c4d}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comma-separated list of origins allowed to call this API (see SecurityConfig).
# Set this explicitly per environment - never use "*" for a service that
# handles authenticated banking data.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# Redis for Caching (Disabled for better local reliability)
spring.cache.type=simple
# spring.data.redis.host=localhost
# spring.data.redis.port=6379

# Logging
logging.level.org.hibernate.SQL=INFO

# Jackson Date Formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# ============================================================================
# Admin bootstrap account
# ----------------------------------------------------------------------------
# ADMIN_PASSWORD must be overridden via an environment variable outside local
# dev. The fallback below ("admin123") is intentionally weak and well-known -
# it exists only so the app boots locally; change it before doing anything
# other than local development, and rotate it immediately if this default was
# ever used anywhere reachable from outside your machine.
# ============================================================================
app.admin.email=${ADMIN_EMAIL:moocash@admin.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
