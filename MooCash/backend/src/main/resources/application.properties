# ============================================================================
# MySQL Datasource
# ============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moocash?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================================
# Security
# ============================================================================
jwt.secret=${JWT_SECRET:CHANGE_ME_local_dev_only_9a4f2c8d3e1f5b6a7c8d9e0f1a2b3c4d}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comma-separated list of origins allowed to call this API (see SecurityConfig).
# Set this explicitly per environment - never use "*" for a service that
# handles authenticated banking data.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# Redis for Caching (Disabled for better local reliability)
spring.cache.type=simple
# spring.data.redis.host=localhost
# spring.data.redis.port=6379

# Logging
logging.level.org.hibernate.SQL=INFO

# Jackson Date Formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# ============================================================================
# Admin bootstrap account
# ============================================================================
app.admin.email=${ADMIN_EMAIL:moocash@admin.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
